name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Do NOT add an `environment: github-pages` block here.
    #
    # It was tried twice on this repository, including after Pages had been
    # enabled with the source set to GitHub Actions, and it failed both times
    # in about two seconds with no runner assigned and no step logs — the
    # environment pre-flight check rejects the job before it is scheduled, so
    # nothing below ever runs and there is nothing to read afterwards.
    #
    # The block only supplies the deployed URL shown on the run page, which is
    # not worth a deploy that fails silently. Deployment itself does not need
    # it: actions/deploy-pages works fine without.
    steps:
      - uses: actions/checkout@v4
      # No build step — the repository root is the site.
      # enablement turns Pages on for the repository if it is not already.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
