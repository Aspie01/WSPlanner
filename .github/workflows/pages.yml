name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Surfaces the deployed URL on the run page in the Actions UI.
    #
    # This block requires Pages to be enabled on the repository already: it
    # makes GitHub check the environment BEFORE scheduling a runner, and the
    # github-pages environment does not exist until Pages has been turned on
    # once. On a repository that has never deployed, the job then fails in
    # about three seconds with no runner assigned and no step logs at all,
    # which is a thoroughly confusing thing to debug. If you fork this repo
    # and hit that, delete these two lines, push once to let the
    # configure-pages step below enable Pages, then put them back.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # No build step — the repository root is the site.
      # enablement turns Pages on for the repository if it is not already.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
